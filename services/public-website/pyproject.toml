[project]
name = "public-website"
version = "0.0.1"
description = "Public-facing website for Plenteon"
readme = "README.md"
authors = [
    { name = "Harold Meerwaldt"}
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

# services/public-website/pyproject.toml
[project.scripts]
plenteon-dev = "public_website:serve_dev"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
